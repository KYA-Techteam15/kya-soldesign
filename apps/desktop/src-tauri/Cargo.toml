[package]
name = "kya-soldesign"
version = "1.1.0"
description = "KYA-SolDesign — dimensionnement d'installations solaires photovoltaïques"
authors = ["KYA-Energy Group"]
license = "LicenseRef-Proprietary"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kya_soldesign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }

[features]
# Activée par la configuration de publication, une fois l'hébergement des mises à
# jour et la clé de signature décidés (specs/010-release-readiness).
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
